# Builds and tests the CLI, the client and the release archives

name: 🔨 Build Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Vet and test with the Go version go.mod declares, so the declared
      # minimum is known to work
      - name: 🏗️ Set up Go (version from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 🧹 Format
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: 🐚 Shellcheck
        run: shellcheck scripts/install.sh

      # Installs the latest published release, so a change of the release
      # assets that breaks the script shows up here
      - name: 📥 Install script
        run: |
          sh scripts/install.sh --prefix "${RUNNER_TEMP}/norn"
          "${RUNNER_TEMP}/norn/bin/norn" --help >/dev/null
          "${RUNNER_TEMP}/norn/bin/norn-client" --help >/dev/null

      - name: 🔎 Vet
        run: go vet ./...

      - name: 🧪 Test
        run: go test -v ./...

      # Releases are built with a current Go, so they carry its fixes
      - name: 🏗️ Set up Go (release toolchain)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: 🧪 Test with the release toolchain
        run: go test ./...

      - name: 🔧 Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # The same configuration builds the release, so a broken release build shows up here
      - name: 👷 Build the release archives and SBOMs
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --snapshot --clean

      - name: 📋 Show the SBOM contents
        run: |
          for sbom in dist/*.cdx.json; do
            echo "== ${sbom}"
            jq -r '.components[] | select(.type == "library") | "\(.name) \(.version)"' "${sbom}" | sort -u
          done

      - name: ✅ Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: norn
          path: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*checksums.txt
